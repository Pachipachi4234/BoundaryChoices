<!DOCTYPE html>
<html lang="ja">
<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->

    <!-- Google Fonts -->

    <style>
        body {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background-color: #0b0f19;
            color: #e2e8f0;
        }
        .serif-text {
            font-family: 'Shippori Mincho', serif;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.8);
        }
        /* Text Box Glow Effect */
        .novel-box {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.85) 0%, rgba(30, 41, 59, 0.95) 100%);
            border: 1px solid rgba(129, 140, 248, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(99, 102, 241, 0.1);
        }
        /* Glassmorphism Panels */
        .glass-panel {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Choice Button Styling */
        .choice-btn {
            background: linear-gradient(90deg, rgba(30, 41, 59, 0.9) 0%, rgba(51, 65, 85, 0.9) 100%);
            border: 1px solid rgba(129, 140, 248, 0.4);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .choice-btn:hover {
            background: linear-gradient(90deg, rgba(79, 70, 229, 0.8) 0%, rgba(124, 58, 237, 0.8) 100%);
            border-color: rgba(199, 210, 254, 0.8);
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }
        /* Character Portrait Effects */
        .portrait-img {
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.7));
            transition: all 0.3s ease-in-out;
        }
        .portrait-active {
            filter: drop-shadow(0 0 25px rgba(129, 140, 248, 0.5)) brightness(1.05);
            transform: scale(1.02);
        }
        .portrait-inactive {
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.8)) brightness(0.5) grayscale(30%);
            transform: scale(0.96);
        }
        /* Custom Animations */
        @keyframes pulse-slow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }
        .animate-pulse-slow {
            animation: pulse-slow 6s infinite ease-in-out;
        }
        /* Cursor Blink */
        .cursor-blink {
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-center items-center relative bg-slate-950 text-slate-100 select-none">

    <!-- GAME CONTAINER -->

                </button>
                <button onclick="openBacklog()" class="px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg bg-slate-800/80 border border-slate-700 hover:bg-indigo-600 transition">

                <button onclick="openFlowchart()" class="px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg bg-slate-800/80 border border-slate-700 hover:bg-indigo-600 transition">

                </button>
                <button onclick="openSaveLoad('save')" class="px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg bg-slate-800/80 border border-slate-700 hover:bg-indigo-600 transition">
                    <i class="fa-solid fa-floppy-disk"></i> <span class="hidden sm:inline">保存</span>
                </button>
                <button onclick="openSaveLoad('load')" class="px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg bg-slate-800/80 border border-slate-700 hover:bg-indigo-600 transition">

        </div>
    </div>

        /* ==========================================================================
           4. STATE & ENGINE CORE
           ========================================================================== */
        let gameState = {
            currentNode: "start",
            typewriterIndex: 0,
            typewriterTimer: null,
            isTyping: false,
            autoPlay: false,
            skipMode: false,
            audioEnabled: false,
            unlockedEndings: [],
            history: [], // Backlog
            visitedNodes: ["start"]
        };

        // Audio Context (Synthesized Audio)
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!gameState.audioEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.05);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.05);
                } else if (type === 'choice') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); // E5
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                } else if (type === 'ending') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.6);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.6);
                }
            } catch (e) {
                console.error("Audio error", e);
            }
        }

        function toggleAudio() {
            initAudio();
            gameState.audioEnabled = !gameState.audioEnabled;
            const icon = document.getElementById('icon-audio');
            const btn = document.getElementById('btn-audio');
            if (gameState.audioEnabled) {
                icon.className = 'fa-solid fa-volume-high';
                btn.classList.add('bg-indigo-600', 'text-white');
                playSound('click');
            } else {
                icon.className = 'fa-solid fa-volume-xmark';
                btn.classList.remove('bg-indigo-600', 'text-white');
            }
        }

        /* Load Saved Storage */
        function loadGlobalSave() {
            const saved = localStorage.getItem('boundary_choices_endings');
            if (saved) {
                try {
                    gameState.unlockedEndings = JSON.parse(saved);
                } catch (e) {
                    gameState.unlockedEndings = [];
                }
            }
            updateEndingBadge();
        }

        function saveGlobalEndings() {
            localStorage.setItem('boundary_choices_endings', JSON.stringify(gameState.unlockedEndings));
            updateEndingBadge();
        }

        function updateEndingBadge() {
            const badge = document.getElementById('ending-count-badge');
            const progress = document.getElementById('modal-ending-progress');
            const count = gameState.unlockedEndings.length;
            badge.innerText = `${count}/20`;
            if (progress) progress.innerText = `達成率: ${count} / 20`;
        }

        /* ==========================================================================
           5. RENDER & SCENARIO CONTROLLER
           ========================================================================== */
        function renderNode(nodeId) {
            const node = SCENARIO[nodeId];
            if (!node) return;

            gameState.currentNode = nodeId;
            if (!gameState.visitedNodes.includes(nodeId)) {
                gameState.visitedNodes.push(nodeId);
            }

            // Check if it's an Ending Node
            if (node.endingId) {
                triggerEnding(node.endingId);
                return;
            }

            // Update UI Header
            document.getElementById('chapter-num').innerText = node.chapter || '1';
            document.getElementById('chapter-title').innerText = node.chapterName || '物語';

            // Background Transition
            if (node.bg) {
                document.getElementById('bg-layer').style.backgroundImage = `url('${node.bg}')`;
            }

            // Character Portraits Setup
            updatePortraits(node);

            // Hide Choices initially
            document.getElementById('choices-container').classList.add('hidden');

            // Speaker Tag
            const speakerInfo = CHARACTERS[node.speaker] || { name: node.speaker, color: "from-slate-700 to-slate-800" };
            const speakerTag = document.getElementById('speaker-tag');
            document.getElementById('speaker-name').innerText = speakerInfo.name;
            speakerTag.className = `absolute -top-4 left-6 md:left-10 px-5 py-1.5 rounded-lg bg-gradient-to-r ${speakerInfo.color} text-white font-bold text-sm md:text-base shadow-lg border border-white/20 flex items-center space-x-2`;

            // Backlog Push
            if (node.text && node.speaker) {
                gameState.history.push({ speaker: speakerInfo.name, text: node.text });
            }

            // Typewriter Effect
            startTypewriter(node.text || "", () => {
                // On typewriter finish
                if (node.choices) {
                    showChoices(node.choices);
                } else if (gameState.autoPlay) {
                    setTimeout(() => {
                        if (gameState.autoPlay) advanceNode();
                    }, 1800);
                } else if (gameState.skipMode) {
                    setTimeout(() => {
                        if (gameState.skipMode) advanceNode();
                    }, 200);
                }
            });
        }

        function updatePortraits(node) {
            const positions = ['left', 'center', 'right'];
            positions.forEach(pos => {
                const box = document.getElementById(`portrait-${pos}-box`);
                const img = document.getElementById(`portrait-${pos}`);
                const charKey = node[pos];

                if (charKey && CHARACTERS[charKey] && CHARACTERS[charKey].image) {
                    img.src = CHARACTERS[charKey].image;
                    box.classList.remove('hidden');

                    // Highlight Active Speaker
                    if (node.speaker === charKey) {
                        img.className = "h-full object-contain object-bottom portrait-img portrait-active";
                    } else {
                        img.className = "h-full object-contain object-bottom portrait-img portrait-inactive";
                    }
                } else {
                    box.classList.add('hidden');
                }
            });
        }

        /* Typewriter Logic */
        function startTypewriter(text, onComplete) {
            clearInterval(gameState.typewriterTimer);
            const textEl = document.getElementById('dialogue-text');
            textEl.innerHTML = '';
            gameState.typewriterIndex = 0;
            gameState.isTyping = true;
            document.getElementById('next-indicator').classList.add('hidden');

            if (gameState.skipMode) {
                textEl.innerText = text;
                gameState.isTyping = false;
                document.getElementById('next-indicator').classList.remove('hidden');
                if (onComplete) onComplete();
                return;
            }

            const speed = 30; // ms per char
            gameState.typewriterTimer = setInterval(() => {
                if (gameState.typewriterIndex < text.length) {
                    textEl.innerText += text.charAt(gameState.typewriterIndex);
                    gameState.typewriterIndex++;
                } else {
                    clearInterval(gameState.typewriterTimer);
                    gameState.isTyping = false;
                    document.getElementById('next-indicator').classList.remove('hidden');
                    if (onComplete) onComplete();
                }
            }, speed);
        }

        function handleStageClick() {
            playSound('click');
            const node = SCENARIO[gameState.currentNode];
            if (!node) return;

            // If typewriter is typing, finish it instantly
            if (gameState.isTyping) {
                clearInterval(gameState.typewriterTimer);
                document.getElementById('dialogue-text').innerText = node.text || '';
                gameState.isTyping = false;
                document.getElementById('next-indicator').classList.remove('hidden');

                if (node.choices) {
                    showChoices(node.choices);
                }
            } else {
                // If typewriter done and no choices active, advance
                if (!node.choices) {
                    advanceNode();
                }
            }
        }

        function advanceNode() {
            const node = SCENARIO[gameState.currentNode];
            if (node && node.next) {
                renderNode(node.next);
            }
        }

        /* Choice Display */
        function showChoices(choices) {
            const container = document.getElementById('choices-container');
            const list = document.getElementById('choices-list');
            list.innerHTML = '';

            choices.forEach((c) => {
                const btn = document.createElement('button');
                btn.className = "choice-btn w-full p-4 rounded-xl text-left font-bold text-slate-100 text-base md:text-lg flex justify-between items-center group cursor-pointer";
                btn.innerHTML = `
                    <span class="group-hover:translate-x-1 transition-transform">${c.text}</span>
                    <i class="fa-solid fa-chevron-right text-indigo-400 group-hover:text-white transition"></i>
                `;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    playSound('choice');
                    container.classList.add('hidden');
                    renderNode(c.next);
                };
                list.appendChild(btn);
            });

            container.classList.remove('hidden');
        }

        /* Auto / Skip Mode Controls */
        function toggleAutoPlay() {
            playSound('click');
            gameState.autoPlay = !gameState.autoPlay;
            if (gameState.autoPlay) gameState.skipMode = false;
            updateControlUI();
            if (gameState.autoPlay && !gameState.isTyping) {
                advanceNode();
            }
        }

        function toggleSkip() {
            playSound('click');
            gameState.skipMode = !gameState.skipMode;
            if (gameState.skipMode) gameState.autoPlay = false;
            updateControlUI();
            if (gameState.skipMode && gameState.isTyping) {
                const node = SCENARIO[gameState.currentNode];
                startTypewriter(node.text || "");
            }
        }

        function updateControlUI() {
            const btnAuto = document.getElementById('btn-auto');
            const btnSkip = document.getElementById('btn-skip');
            
            if (gameState.autoPlay) {
                btnAuto.classList.add('bg-indigo-600', 'text-white');
                document.getElementById('text-auto').innerText = 'Auto: ON';
            } else {
                btnAuto.classList.remove('bg-indigo-600', 'text-white');
                document.getElementById('text-auto').innerText = 'Auto: OFF';
            }

            if (gameState.skipMode) {
                btnSkip.classList.add('bg-amber-600', 'text-white');
                document.getElementById('text-skip').innerText = 'Skip: ON';
            } else {
                btnSkip.classList.remove('bg-amber-600', 'text-white');
                document.getElementById('text-skip').innerText = 'Skip: OFF';
            }
        }

        /* ==========================================================================
           6. ENDING HANDLING & MODALS
           ========================================================================== */
        function triggerEnding(endingId) {
            playSound('ending');
            const endData = ENDINGS.find(e => e.id === endingId) || { title: "UNKNOWN END", desc: "" };

            // Save Achievement
            if (!gameState.unlockedEndings.includes(endingId)) {
                gameState.unlockedEndings.push(endingId);
                saveGlobalEndings();
            }

            document.getElementById('end-title').innerText = `ENDING ${endingId.toString().padStart(2, '0')}: ${endData.title}`;
            document.getElementById('end-desc').innerText = endData.desc;
            document.getElementById('ending-screen').classList.remove('hidden');
        }

        function restartGame() {
            document.getElementById('ending-screen').classList.add('hidden');
            gameState.currentNode = "start";
            gameState.history = [];
            renderNode("start");
        }

        /* Modal Controllers */
        function openBacklog() {
            playSound('click');
            const list = document.getElementById('backlog-content');
            list.innerHTML = '';

            gameState.history.forEach(item => {
                const div = document.createElement('div');
                div.className = "p-3 rounded-lg bg-slate-900/60 border border-slate-800";
                div.innerHTML = `<span class="font-bold text-indigo-400 block text-xs mb-1">${item.speaker}</span><p class="text-slate-200 serif-text">${item.text}</p>`;
                list.appendChild(div);
            });

            document.getElementById('modal-backlog').classList.remove('hidden');
        }

        function openFlowchart() {
            playSound('click');
            const tree = document.getElementById('flowchart-tree');
            tree.innerHTML = '';

            // Render list of nodes visited
            gameState.visitedNodes.forEach(nodeId => {
                const n = SCENARIO[nodeId];
                if (n && n.text) {
                    const nodeDiv = document.createElement('div');
                    const isCurrent = nodeId === gameState.currentNode;
                    nodeDiv.className = `p-3 rounded-xl border ${isCurrent ? 'bg-indigo-900/50 border-indigo-400 text-white' : 'bg-slate-900/50 border-slate-800 text-slate-400'} flex justify-between items-center`;
                    nodeDiv.innerHTML = `
                        <div>
                            <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-indigo-300 mr-2">${n.chapterName || '分岐'}</span>
                            <span class="text-sm font-medium">${n.speaker ? CHARACTERS[n.speaker]?.name + ': ' : ''}${n.text.substring(0, 25)}...</span>
                        </div>
                        ${isCurrent ? '<span class="text-xs font-bold text-amber-400 bg-amber-950/60 px-2 py-0.5 rounded-full border border-amber-500/40">現在地</span>' : ''}
                    `;
                    tree.appendChild(nodeDiv);
                }
            });

            document.getElementById('modal-flowchart').classList.remove('hidden');
        }

        function openEndingsModal() {
            playSound('click');
            const grid = document.getElementById('endings-grid');
            grid.innerHTML = '';

            ENDINGS.forEach(end => {
                const isUnlocked = gameState.unlockedEndings.includes(end.id);
                const card = document.createElement('div');
                card.className = `p-4 rounded-xl border ${isUnlocked ? 'bg-slate-900/90 border-indigo-500/50 text-slate-100' : 'bg-slate-950/50 border-slate-800/60 text-slate-600'} flex flex-col justify-between`;
                
                let badgeColor = 'bg-slate-800 text-slate-500';
                if (isUnlocked) {
                    if (end.type === 'TRUE') badgeColor = 'bg-amber-500/20 text-amber-300 border border-amber-500/40';
                    else if (end.type === 'GOOD') badgeColor = 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40';
                    else if (end.type === 'BAD') badgeColor = 'bg-rose-500/20 text-rose-300 border border-rose-500/40';
                    else badgeColor = 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/40';
                }

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${badgeColor}">
                                ENDING ${end.id.toString().padStart(2, '0')} [${end.type}]
                            </span>
                            <i class="fa-solid ${isUnlocked ? 'fa-lock-open text-amber-400' : 'fa-lock text-slate-700'}"></i>
                        </div>
                        <h4 class="font-bold text-base mb-1 serif-text ${isUnlocked ? 'text-slate-100' : 'text-slate-600'}">
                            ${isUnlocked ? end.title : '？？？？？？？？'}
                        </h4>
                        <p class="text-xs leading-relaxed ${isUnlocked ? 'text-slate-400' : 'text-slate-700'} serif-text">
                            ${isUnlocked ? end.desc : '条件を満たすと開放されます。'}
                        </p>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('modal-endings').classList.remove('hidden');
        }

        /* Save & Load System */
        function openSaveLoad(mode) {
            playSound('click');
            const title = document.getElementById('saveload-title');
            const slotsContainer = document.getElementById('saveload-slots');
            title.innerHTML = mode === 'save' ? '<i class="fa-solid fa-floppy-disk"></i> セーブデータの保存' : '<i class="fa-solid fa-folder-open"></i> セーブデータの読込';
            slotsContainer.innerHTML = '';

            for (let i = 1; i <= 6; i++) {
                const saveDataKey = `boundary_choices_slot_${i}`;
                const savedDataRaw = localStorage.getItem(saveDataKey);
                let saveData = null;
                if (savedDataRaw) {
                    try { saveData = JSON.parse(savedDataRaw); } catch(e){}
                }

                const slot = document.createElement('div');
                slot.className = "p-4 rounded-xl bg-slate-900/80 border border-slate-800 hover:border-indigo-500/50 flex justify-between items-center transition";
                
                if (saveData) {
                    slot.innerHTML = `
                        <div>
                            <span class="text-xs font-bold text-indigo-400 block mb-1">スロット ${i} - ${saveData.date}</span>
                            <p class="text-sm font-medium text-slate-200">${saveData.chapterName || '保存データ'}</p>
                            <p class="text-xs text-slate-400 truncate max-w-md mt-1 serif-text">${saveData.previewText}</p>
                        </div>
                        <button onclick="executeSaveLoad('${mode}', ${i})" class="px-4 py-2 rounded-lg text-sm font-bold ${mode==='save'?'bg-indigo-600 hover:bg-indigo-500':'bg-emerald-600 hover:bg-emerald-500'} text-white transition">
                            ${mode === 'save' ? '上書き保存' : 'ロード'}
                        </button>
                    `;
                } else {
                    slot.innerHTML = `
                        <div>
                            <span class="text-xs font-bold text-slate-500 block mb-1">スロット ${i}</span>
                            <p class="text-sm font-medium text-slate-600">---- NO DATA ----</p>
                        </div>
                        <button onclick="executeSaveLoad('${mode}', ${i})" class="px-4 py-2 rounded-lg text-sm font-bold ${mode==='save'?'bg-indigo-600 hover:bg-indigo-500':'opacity-50 bg-slate-800 cursor-not-allowed'} text-white transition" ${mode==='load'?'disabled':''}>
                            ${mode === 'save' ? '新規保存' : '空き'}
                        </button>
                    `;
                }
                slotsContainer.appendChild(slot);
            }

            document.getElementById('modal-saveload').classList.remove('hidden');
        }

        function executeSaveLoad(mode, slotIndex) {
            playSound('click');
            const key = `boundary_choices_slot_${slotIndex}`;
            if (mode === 'save') {
                const currentNodeObj = SCENARIO[gameState.currentNode];
                const savePayload = {
                    nodeId: gameState.currentNode,
                    chapterName: currentNodeObj ? currentNodeObj.chapterName : '不明',
                    previewText: currentNodeObj ? currentNodeObj.text : '',
                    date: new Date().toLocaleString('ja-JP'),
                    history: gameState.history,
                    visitedNodes: gameState.visitedNodes
                };
                localStorage.setItem(key, JSON.stringify(savePayload));
                openSaveLoad('save'); // Refresh modal
            } else if (mode === 'load') {
                const raw = localStorage.getItem(key);
                if (raw) {
                    const data = JSON.parse(raw);
                    gameState.currentNode = data.nodeId;
                    gameState.history = data.history || [];
                    gameState.visitedNodes = data.visitedNodes || [data.nodeId];
                    closeModal('modal-saveload');
                    renderNode(data.nodeId);
                }
            }
        }

        function closeModal(id) {
            playSound('click');
            document.getElementById(id).classList.add('hidden');
        }

        /* Keyboard Support */
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Enter') {
                handleStageClick();
            }
        });

        /* ==========================================================================
           7. INITIALIZATION
           ========================================================================== */
        window.onload = function() {
            loadGlobalSave();
            renderNode("start");
        };
    </script>
</body>
</html>
