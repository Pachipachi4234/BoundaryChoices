<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>境界の選択肢 - Boundary Choices (300 END Complete Edition)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background-color: #07090e;
            color: #e2e8f0;
        }
        .serif-text {
            font-family: 'Shippori Mincho', serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 3px;
        }
        .novel-box {
            background: linear-gradient(180deg, rgba(10, 15, 30, 0.92) 0%, rgba(20, 28, 48, 0.96) 100%);
            border: 1px solid rgba(129, 140, 248, 0.35);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(99, 102, 241, 0.15);
        }
        .glass-panel {
            background: rgba(10, 15, 30, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .choice-btn {
            background: linear-gradient(90deg, rgba(30, 41, 59, 0.92) 0%, rgba(49, 62, 89, 0.92) 100%);
            border: 1px solid rgba(129, 140, 248, 0.4);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .choice-btn:hover {
            background: linear-gradient(90deg, rgba(79, 70, 229, 0.85) 0%, rgba(124, 58, 237, 0.85) 100%);
            border-color: rgba(199, 210, 254, 0.9);
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.5);
        }
        .portrait-svg {
            filter: drop-shadow(0 15px 20px rgba(0, 0, 0, 0.8));
            transition: all 0.35s ease-in-out;
            max-height: 85vh;
            width: auto;
        }
        .portrait-active {
            filter: drop-shadow(0 0 30px rgba(129, 140, 248, 0.8)) brightness(1.05);
            transform: scale(1.03);
            opacity: 1;
        }
        .portrait-inactive {
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.9)) brightness(0.45) grayscale(30%);
            transform: scale(0.96);
            opacity: 0.5;
        }
        .title-btn {
            background: linear-gradient(90deg, rgba(30, 41, 59, 0.85) 0%, rgba(49, 62, 89, 0.85) 100%);
            border: 1px solid rgba(165, 180, 252, 0.3);
            transition: all 0.3s ease;
        }
        .title-btn:hover {
            background: linear-gradient(90deg, rgba(79, 70, 229, 0.9) 0%, rgba(147, 51, 234, 0.9) 100%);
            border-color: rgba(224, 231, 255, 0.8);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.6);
            transform: translateX(6px);
        }
        /* アニメーション背景 */
        .bg-gradient-animated {
            background: linear-gradient(-45deg, #0a0e1a, #161a30, #1f1535, #081226);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-center items-center relative bg-slate-950 text-slate-100 select-none">

    <!-- TITLE / START SCREEN OVERLAY -->
    <div id="title-screen" class="fixed inset-0 z-50 flex flex-col justify-between items-center bg-gradient-animated p-8 transition-all duration-700">
        <div class="absolute inset-0 bg-slate-950/40 backdrop-blur-sm"></div>

        <!-- Title Header -->
        <div class="relative z-10 text-center mt-12 md:mt-20">
            <p class="text-indigo-400 font-bold tracking-[0.3em] text-xs md:text-sm uppercase mb-2 animate-pulse">Interactive Anime Visual Novel</p>
            <h1 class="text-4xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-200 via-purple-100 to-pink-200 serif-text tracking-wider drop-shadow-2xl">
                境界の選択肢
            </h1>
            <p class="text-slate-400 text-xs md:text-base mt-3 serif-text tracking-widest">— Boundary Choices (300 END Complete Edition) —</p>
        </div>

        <!-- Title Menu Buttons -->
        <div class="relative z-10 w-full max-w-md flex flex-col space-y-4 mb-12">
            <button onclick="startGameFromTitle()" class="title-btn p-4 rounded-xl font-bold text-lg text-white flex items-center justify-between px-6 shadow-xl">
                <span class="flex items-center space-x-3"><i class="fa-solid fa-play text-indigo-400"></i><span>最初から始める</span></span>
                <i class="fa-solid fa-arrow-right text-xs opacity-60"></i>
            </button>
            <button onclick="openSaveLoadFromTitle()" class="title-btn p-4 rounded-xl font-bold text-lg text-white flex items-center justify-between px-6 shadow-xl">
                <span class="flex items-center space-x-3"><i class="fa-solid fa-folder-open text-indigo-400"></i><span>ロード（続きから）</span></span>
                <i class="fa-solid fa-arrow-right text-xs opacity-60"></i>
            </button>
            <button onclick="openEndingsModal()" class="title-btn p-4 rounded-xl font-bold text-lg text-white flex items-center justify-between px-6 shadow-xl">
                <span class="flex items-center space-x-3"><i class="fa-solid fa-trophy text-amber-400"></i><span>エンディング画廊 (全300種)</span></span>
                <span id="title-ending-count" class="text-xs bg-amber-950/80 text-amber-300 border border-amber-500/40 px-2.5 py-1 rounded-full">0/300</span>
            </button>
        </div>

        <div class="relative z-10 text-xs text-slate-500 font-mono">© 2026 Boundary Choices Project. All rights reserved.</div>
    </div>

    <!-- GAME CONTAINER -->
    <div id="game-container" class="relative w-full h-full max-w-[1920px] max-h-[1080px] overflow-hidden flex flex-col justify-between shadow-2xl bg-gradient-animated">
        
        <!-- BACKGROUND LAYER -->
        <div id="bg-layer" class="absolute inset-0 transition-all duration-700 bg-slate-900/60">
            <div id="bg-overlay" class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-slate-950/20 transition-all duration-500"></div>
        </div>

        <!-- TOP BAR / NAVIGATION -->
        <header class="relative z-20 flex justify-between items-center p-4 md:p-6 bg-gradient-to-b from-slate-950/90 to-transparent">
            <div class="flex items-center space-x-3">
                <button onclick="returnToTitle()" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-slate-300 transition flex items-center space-x-1">
                    <i class="fa-solid fa-house text-xs"></i> <span class="hidden sm:inline">タイトル</span>
                </button>
                <span class="text-xs md:text-sm font-bold tracking-widest px-3 py-1 bg-indigo-900/60 border border-indigo-500/40 rounded-full text-indigo-300 uppercase">
                    Chapter <span id="chapter-num">1</span>: <span id="chapter-title">始動</span>
                </span>
            </div>

            <!-- System Controls -->
            <div class="flex items-center space-x-2 md:space-x-3">
                <button onclick="toggleAutoPlay()" id="btn-auto" class="px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg bg-slate-800/80 border border-slate-700 hover:bg-indigo-600 transition flex items-center space-x-1">
                    <i class="fa-solid fa-play text-xs"></i> <span id="text-auto">Auto: OFF</span>
                </button>
                <button onclick="openBacklog()" class="px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg bg-slate-800/80 border border-slate-700 hover:bg-indigo-600 transition">
                    <i class="fa-solid fa-list-ul"></i> <span class="hidden sm:inline">履歴</span>
                </button>
                <button onclick="openSaveLoad('save')" class="px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg bg-slate-800/80 border border-slate-700 hover:bg-indigo-600 transition">
                    <i class="fa-solid fa-floppy-disk"></i> <span class="hidden sm:inline">保存</span>
                </button>
                <button onclick="openSaveLoad('load')" class="px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg bg-slate-800/80 border border-slate-700 hover:bg-indigo-600 transition">
                    <i class="fa-solid fa-folder-open"></i> <span class="hidden sm:inline">読込</span>
                </button>
                <button onclick="openEndingsModal()" class="px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg bg-indigo-900/80 border border-indigo-500/50 hover:bg-indigo-700 transition text-indigo-200">
                    <i class="fa-solid fa-trophy"></i> <span id="ending-count-badge">0/300</span>
                </button>
                <button onclick="toggleAudio()" id="btn-audio" class="p-2 text-sm rounded-lg bg-slate-800/80 border border-slate-700 hover:bg-indigo-600 transition text-slate-300">
                    <i class="fa-solid fa-volume-xmark" id="icon-audio"></i>
                </button>
            </div>
        </header>

        <!-- CHARACTER PORTRAITS STAGE (SVGベクター描画アニメキャラクター) -->
        <div id="character-stage" class="relative flex-1 w-full flex justify-center items-end px-4 md:px-16 pointer-events-none z-10 pb-2">
            <!-- 結衣 (銀髪セーラー服) -->
            <div id="char-box-yui" class="hidden w-1/3 max-w-[360px] h-[85%] relative flex justify-center items-end transition-all duration-300">
                <svg class="portrait-svg" viewBox="0 0 200 400" id="svg-yui">
                    <ellipse cx="100" cy="80" rx="36" ry="42" fill="#fde8e8"/>
                    <path d="M 55,85 Q 45,15 100,8 Q 155,15 145,85 Q 160,160 142,210 L 58,210 Q 40,160 55,85 Z" fill="#e2e8f0"/>
                    <circle cx="84" cy="78" r="6" fill="#3b82f6"/><circle cx="116" cy="78" r="6" fill="#3b82f6"/>
                    <path d="M 55,180 L 145,180 L 158,320 L 42,320 Z" fill="#1e1b4b"/>
                    <polygon points="100,180 82,225 118,225" fill="#ef4444"/>
                </svg>
            </div>
            <!-- 葵 (黒髪ブレザー) -->
            <div id="char-box-aoi" class="hidden w-1/3 max-w-[360px] h-[85%] relative flex justify-center items-end transition-all duration-300">
                <svg class="portrait-svg" viewBox="0 0 200 400" id="svg-aoi">
                    <ellipse cx="100" cy="80" rx="36" ry="42" fill="#fde8e8"/>
                    <path d="M 50,85 Q 40,5 100,3 Q 160,5 150,85 Q 165,180 145,240 L 55,240 Q 35,180 50,85 Z" fill="#1e293b"/>
                    <circle cx="84" cy="78" r="6" fill="#e11d48"/><circle cx="116" cy="78" r="6" fill="#e11d48"/>
                    <path d="M 50,180 L 150,180 L 160,320 L 40,320 Z" fill="#0f172a"/>
                    <polygon points="100,180 88,215 112,215" fill="#be123c"/>
                </svg>
            </div>
            <!-- 蓮 (眼鏡生徒会長) -->
            <div id="char-box-ren" class="hidden w-1/3 max-w-[360px] h-[85%] relative flex justify-center items-end transition-all duration-300">
                <svg class="portrait-svg" viewBox="0 0 200 400" id="svg-ren">
                    <ellipse cx="100" cy="75" rx="34" ry="40" fill="#fde8e8"/>
                    <path d="M 60,70 Q 50,20 100,15 Q 150,20 140,70 Q 145,120 138,150 L 62,150 Z" fill="#334155"/>
                    <!-- メガネ -->
                    <rect x="70" y="68" width="22" height="12" rx="2" fill="none" stroke="#64748b" stroke-width="2"/>
                    <rect x="108" y="68" width="22" height="12" rx="2" fill="none" stroke="#64748b" stroke-width="2"/>
                    <line x1="92" y1="74" x2="108" y2="74" stroke="#64748b" stroke-width="2"/>
                    <path d="M 52,170 L 148,170 L 155,330 L 45,330 Z" fill="#1e293b"/>
                </svg>
            </div>
            <!-- 翔 (幼馴染男子) -->
            <div id="char-box-sho" class="hidden w-1/3 max-w-[360px] h-[85%] relative flex justify-center items-end transition-all duration-300">
                <svg class="portrait-svg" viewBox="0 0 200 400" id="svg-sho">
                    <ellipse cx="100" cy="80" rx="35" ry="40" fill="#fde8e8"/>
                    <path d="M 52,75 Q 40,25 100,12 Q 160,25 148,75 Q 155,100 145,130 L 55,130 Z" fill="#78350f"/>
                    <circle cx="84" cy="78" r="5" fill="#b45309"/><circle cx="116" cy="78" r="5" fill="#b45309"/>
                    <path d="M 50,175 L 150,175 L 160,330 L 40,330 Z" fill="#334155"/>
                </svg>
            </div>
        </div>

        <!-- CHOICES OVERLAY -->
        <div id="choices-container" class="hidden absolute inset-0 z-30 flex flex-col justify-center items-center bg-slate-950/80 backdrop-blur-md p-6 space-y-4">
            <h3 class="text-xl md:text-2xl font-bold text-indigo-300 mb-2 tracking-wide serif-text">運命の選択</h3>
            <div id="choices-list" class="w-full max-w-2xl flex flex-col space-y-3"></div>
        </div>

        <!-- NOVEL DIALOGUE BOX -->
        <div class="relative z-20 w-full p-4 md:p-8 flex justify-center cursor-pointer" onclick="handleStageClick()">
            <div class="w-full max-w-5xl novel-box rounded-2xl p-5 md:p-8 relative transition-all duration-300">
                <!-- Character Name Tag -->
                <div id="speaker-tag" class="absolute -top-4 left-6 md:left-10 px-5 py-1.5 rounded-lg bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold text-sm md:text-base shadow-lg border border-indigo-400/30 flex items-center space-x-2">
                    <i class="fa-solid fa-user text-xs opacity-75"></i>
                    <span id="speaker-name">???</span>
                </div>

                <!-- Text Area -->
                <div class="mt-2 min-h-[90px] md:min-h-[110px] text-base md:text-lg text-slate-100 leading-relaxed md:leading-loose tracking-wide serif-text">
                    <p id="dialogue-text"></p>
                </div>

                <!-- Next Indicator Arrow -->
                <div id="next-indicator" class="absolute bottom-4 right-6 text-indigo-400 animate-bounce">
                    <i class="fa-solid fa-caret-down text-xl"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: BACKLOG -->
    <div id="modal-backlog" class="hidden fixed inset-0 z-50 flex justify-center items-center bg-slate-950/80 backdrop-blur-md p-4">
        <div class="w-full max-w-3xl max-h-[80vh] glass-panel rounded-2xl p-6 flex flex-col shadow-2xl border border-indigo-500/30">
            <div class="flex justify-between items-center pb-4 border-b border-slate-700">
                <h2 class="text-xl font-bold text-indigo-300 flex items-center space-x-2">
                    <i class="fa-solid fa-list-ul"></i> <span>会話履歴 (バックログ)</span>
                </h2>
                <button onclick="closeModal('modal-backlog')" class="text-slate-400 hover:text-white text-2xl">×</button>
            </div>
            <div id="backlog-content" class="flex-1 overflow-y-auto my-4 space-y-4 pr-2 text-sm md:text-base"></div>
        </div>
    </div>

    <!-- MODAL: ENDINGS LIST (300 END) -->
    <div id="modal-endings" class="hidden fixed inset-0 z-50 flex justify-center items-center bg-slate-950/85 backdrop-blur-md p-4">
        <div class="w-full max-w-5xl max-h-[85vh] glass-panel rounded-2xl p-6 flex flex-col shadow-2xl border border-indigo-500/30">
            <div class="flex justify-between items-center pb-4 border-b border-slate-700">
                <h2 class="text-xl font-bold text-indigo-300 flex items-center space-x-2">
                    <i class="fa-solid fa-trophy text-amber-400"></i> <span>エンディングギャラリー (全300種)</span>
                </h2>
                <div class="flex items-center space-x-4">
                    <span id="modal-ending-progress" class="text-sm font-bold text-amber-400 bg-amber-950/50 border border-amber-500/40 px-3 py-1 rounded-full">達成率: 0 / 300</span>
                    <button onclick="closeModal('modal-endings')" class="text-slate-400 hover:text-white text-2xl">×</button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto my-4 pr-2">
                <div id="endings-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3"></div>
            </div>
        </div>
    </div>

    <!-- MODAL: SAVE / LOAD -->
    <div id="modal-saveload" class="hidden fixed inset-0 z-50 flex justify-center items-center bg-slate-950/85 backdrop-blur-md p-4">
        <div class="w-full max-w-3xl max-h-[85vh] glass-panel rounded-2xl p-6 flex flex-col shadow-2xl border border-indigo-500/30">
            <div class="flex justify-between items-center pb-4 border-b border-slate-700">
                <h2 id="saveload-title" class="text-xl font-bold text-indigo-300 flex items-center space-x-2">
                    <i class="fa-solid fa-floppy-disk"></i> <span>セーブデータ一覧</span>
                </h2>
                <button onclick="closeModal('modal-saveload')" class="text-slate-400 hover:text-white text-2xl">×</button>
            </div>
            <div id="saveload-slots" class="flex-1 overflow-y-auto my-4 space-y-3 pr-2"></div>
        </div>
    </div>

    <!-- ENDING ANNOUNCEMENT OVERLAY -->
    <div id="ending-screen" class="hidden fixed inset-0 z-50 flex flex-col justify-center items-center bg-black/95 p-6 text-center animate-fade-in">
        <div class="mb-2 text-amber-400 text-sm tracking-widest uppercase font-bold px-4 py-1 border border-amber-500/40 rounded-full bg-amber-950/40">Ending Reached</div>
        <h2 id="end-title" class="text-3xl md:text-5xl font-extrabold text-amber-300 mb-4 serif-text">ENDING #001</h2>
        <p id="end-desc" class="max-w-xl text-slate-300 text-sm md:text-base leading-relaxed mb-8 serif-text"></p>
        <div class="flex space-x-4">
            <button onclick="returnToTitle()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg transition">タイトル画面へ</button>
            <button onclick="openEndingsModal()" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-indigo-300 font-bold rounded-xl border border-indigo-500/30 transition">エンディング一覧</button>
        </div>
    </div>

    <!-- SCRIPT ENGINE -->
    <script>
        const CHARACTERS = {
            yui: { name: "結衣 (Yui)", color: "from-sky-500 to-indigo-600" },
            aoi: { name: "葵 (Aoi)", color: "from-rose-600 to-red-700" },
            ren: { name: "蓮 (Ren)", color: "from-emerald-600 to-teal-700" },
            sho: { name: "翔 (Sho)", color: "from-amber-500 to-orange-600" },
            hero: { name: "主人公", color: "from-indigo-600 to-violet-600" },
            system: { name: "システム", color: "from-slate-700 to-slate-800" }
        };

        let stats = { yui: 0, aoi: 0, ren: 0, sho: 0, chaos: 0 };

        const SCENARIO = {
            "start": {
                chapter: 1, chapterName: "始動 - 境界の予兆",
                speaker: "hero", text: "夕暮れ時に赤く染まる誠心学園。校内に不穏な風が吹き抜けた。",
                activeChar: null, next: "node_1"
            },
            "node_1": {
                chapter: 1, chapterName: "始動 - 境界の予兆",
                speaker: "yui", text: "「転校生くん！もうすぐ校門が閉まっちゃうよ！」",
                activeChar: "yui",
                choices: [
                    { text: "【1】結衣と一緒に急いで帰る (+結衣)", next: "path_yui", action: () => stats.yui += 3 },
                    { text: "【2】図書室で葵の本を探す (+葵)", next: "path_aoi", action: () => stats.aoi += 3 },
                    { text: "【3】生徒会室で蓮の手伝いをする (+蓮)", next: "path_ren", action: () => stats.ren += 3 },
                    { text: "【4】屋上で翔とサボる (+翔)", next: "path_sho", action: () => stats.sho += 3 },
                    { text: "【5】怪しい地下階段を調べる (+カオス)", next: "path_chaos", action: () => stats.chaos += 5 }
                ]
            },
            "path_yui": {
                chapter: 2, chapterName: "銀髪の少女",
                speaker: "yui", text: "「一緒に走ってくれてありがとう！実は学園に昔から伝わる秘密があってね…」",
                activeChar: "yui",
                choices: [
                    { text: "秘密について詳しく聞き出す", next: "path_deep", action: () => stats.yui += 2 },
                    { text: "寄り道してカフェに行く", next: "path_deep", action: () => stats.yui += 1 }
                ]
            },
            "path_aoi": {
                chapter: 2, chapterName: "静寂の図書室",
                speaker: "aoi", text: "「……あら。まだ残っていたの？この古文書、読めるかしら。」",
                activeChar: "aoi",
                choices: [
                    { text: "解読を手伝う", next: "path_deep", action: () => stats.aoi += 2 },
                    { text: "黒い瞳の秘密について尋ねる", next: "path_deep", action: () => stats.aoi += 1 }
                ]
            },
            "path_ren": {
                chapter: 2, chapterName: "生徒会長の決断",
                speaker: "ren", text: "「遅くまでご苦労様。学園の異変データについて君の意見を聞きたい。」",
                activeChar: "ren",
                choices: [
                    { text: "協力して調査を進める", next: "path_deep", action: () => stats.ren += 2 },
                    { text: "データを分析する", next: "path_deep", action: () => stats.ren += 1 }
                ]
            },
            "path_sho": {
                chapter: 2, chapterName: "黄昏の屋上",
                speaker: "sho", text: "「よっ！お前も夕日を見に来たのか？いい風が吹いてるぜ！」",
                activeChar: "sho",
                choices: [
                    { text: "将来の夢について語る", next: "path_deep", action: () => stats.sho += 2 },
                    { text: "フェンスの向こう側を見る", next: "path_deep", action: () => stats.sho += 1 }
                ]
            },
            "path_chaos": {
                chapter: 2, chapterName: "深淵の扉",
                speaker: "system", text: "地下の扉を開けると、300の次元が交差する光の渦が広が生じていた！",
                activeChar: null,
                choices: [
                    { text: "飛び込む！", next: "path_deep", action: () => stats.chaos += 10 },
                    { text: "慎重に調べる", next: "path_deep", action: () => stats.chaos += 5 }
                ]
            },
            "path_deep": {
                chapter: 3, chapterName: "選択の果てに",
                speaker: "hero", text: "あなたの選んだ言葉と行動が、世界の境界線を決定づける……。",
                activeChar: null,
                next: null // 判定へ
            }
        };

        let gameState = {
            currentNode: "start",
            typewriterIndex: 0,
            typewriterTimer: null,
            isTyping: false,
            autoPlay: false,
            audioEnabled: false,
            unlockedEndings: [],
            history: []
        };

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            if (!gameState.audioEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'click') {
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
                } else if (type === 'ending') {
                    osc.frequency.setValueAtTime(523, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1046, audioCtx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
                }
            } catch (e){}
        }

        function toggleAudio() {
            initAudio();
            gameState.audioEnabled = !gameState.audioEnabled;
            const icon = document.getElementById('icon-audio');
            const btn = document.getElementById('btn-audio');
            if (gameState.audioEnabled) {
                icon.className = 'fa-solid fa-volume-high';
                btn.classList.add('bg-indigo-600', 'text-white');
                playSound('click');
            } else {
                icon.className = 'fa-solid fa-volume-xmark';
                btn.classList.remove('bg-indigo-600', 'text-white');
            }
        }

        function loadGlobalSave() {
            const saved = localStorage.getItem('boundary_choices_300');
            if (saved) {
                try { gameState.unlockedEndings = JSON.parse(saved); } catch (e) { gameState.unlockedEndings = []; }
            }
            updateEndingBadge();
        }

        function saveGlobalEndings() {
            localStorage.setItem('boundary_choices_300', JSON.stringify(gameState.unlockedEndings));
            updateEndingBadge();
        }

        function updateEndingBadge() {
            const count = gameState.unlockedEndings.length;
            document.getElementById('ending-count-badge').innerText = `${count}/300`;
            const titleCount = document.getElementById('title-ending-count');
            if (titleCount) titleCount.innerText = `${count}/300`;
            const progress = document.getElementById('modal-ending-progress');
            if (progress) progress.innerText = `達成率: ${count} / 300 (${Math.round(count/3*100)/100}%)`;
        }

        function startGameFromTitle() {
            playSound('click');
            document.getElementById('title-screen').classList.add('hidden');
            gameState.currentNode = "start";
            gameState.history = [];
            stats = { yui: 0, aoi: 0, ren: 0, sho: 0, chaos: 0 };
            renderNode("start");
        }

        function openSaveLoadFromTitle() {
            playSound('click');
            openSaveLoad('load');
        }

        function returnToTitle() {
            playSound('click');
            document.getElementById('ending-screen').classList.add('hidden');
            document.getElementById('title-screen').classList.remove('hidden');
        }

        function renderNode(nodeId) {
            const node = SCENARIO[nodeId];
            if (!node) {
                let endId = calculateEndingId();
                triggerEnding(endId);
                return;
            }

            gameState.currentNode = nodeId;
            document.getElementById('chapter-num').innerText = node.chapter || '1';
            document.getElementById('chapter-title').innerText = node.chapterName || '物語';

            updatePortraits(node.activeChar);

            document.getElementById('choices-container').classList.add('hidden');

            const speakerInfo = CHARACTERS[node.speaker] || { name: node.speaker, color: "from-slate-700 to-slate-800" };
            const speakerTag = document.getElementById('speaker-tag');
            document.getElementById('speaker-name').innerText = speakerInfo.name;
            speakerTag.className = `absolute -top-4 left-6 md:left-10 px-5 py-1.5 rounded-lg bg-gradient-to-r ${speakerInfo.color} text-white font-bold text-sm md:text-base shadow-lg border border-white/20 flex items-center space-x-2`;

            if (node.text && node.speaker) {
                gameState.history.push({ speaker: speakerInfo.name, text: node.text });
            }

            startTypewriter(node.text || "", () => {
                if (node.choices) {
                    showChoices(node.choices);
                } else if (node.next === null) {
                    let endId = calculateEndingId();
                    triggerEnding(endId);
                } else if (gameState.autoPlay) {
                    setTimeout(() => { if (gameState.autoPlay) advanceNode(); }, 1800);
                }
            });
        }

        function updatePortraits(activeChar) {
            const chars = ['yui', 'aoi', 'ren', 'sho'];
            chars.forEach(c => {
                const box = document.getElementById(`char-box-${c}`);
                const svg = document.getElementById(`svg-${c}`);
                if (c === activeChar) {
                    box.classList.remove('hidden');
                    svg.className = "portrait-svg portrait-active";
                } else {
                    box.classList.add('hidden');
                    svg.className = "portrait-svg portrait-inactive";
                }
            });
        }

        function startTypewriter(text, onComplete) {
            clearInterval(gameState.typewriterTimer);
            const textEl = document.getElementById('dialogue-text');
            textEl.innerHTML = '';
            gameState.typewriterIndex = 0;
            gameState.isTyping = true;
            document.getElementById('next-indicator').classList.add('hidden');

            gameState.typewriterTimer = setInterval(() => {
                if (gameState.typewriterIndex < text.length) {
                    textEl.innerText += text.charAt(gameState.typewriterIndex);
                    gameState.typewriterIndex++;
                } else {
                    clearInterval(gameState.typewriterTimer);
                    gameState.isTyping = false;
                    document.getElementById('next-indicator').classList.remove('hidden');
                    if (onComplete) onComplete();
                }
            }, 30);
        }

        function handleStageClick() {
            playSound('click');
            const node = SCENARIO[gameState.currentNode];
            if (!node) return;

            if (gameState.isTyping) {
                clearInterval(gameState.typewriterTimer);
                document.getElementById('dialogue-text').innerText = node.text || '';
                gameState.isTyping = false;
                document.getElementById('next-indicator').classList.remove('hidden');

                if (node.choices) showChoices(node.choices);
            } else {
                if (!node.choices) advanceNode();
            }
        }

        function advanceNode() {
            const node = SCENARIO[gameState.currentNode];
            if (node && node.next) {
                renderNode(node.next);
            } else {
                let endId = calculateEndingId();
                triggerEnding(endId);
            }
        }

        function showChoices(choices) {
            const container = document.getElementById('choices-container');
            const list = document.getElementById('choices-list');
            list.innerHTML = '';

            choices.forEach((c) => {
                const btn = document.createElement('button');
                btn.className = "choice-btn w-full p-4 rounded-xl text-left font-bold text-slate-100 text-base md:text-lg flex justify-between items-center group cursor-pointer";
                btn.innerHTML = `
                    <span class="group-hover:translate-x-1 transition-transform">${c.text}</span>
                    <i class="fa-solid fa-chevron-right text-indigo-400 group-hover:text-white transition"></i>
                `;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    playSound('click');
                    if (c.action) c.action();
                    container.classList.add('hidden');
                    renderNode(c.next);
                };
                list.appendChild(btn);
            });

            container.classList.remove('hidden');
        }

        function toggleAutoPlay() {
            playSound('click');
            gameState.autoPlay = !gameState.autoPlay;
            const btnAuto = document.getElementById('btn-auto');
            if (gameState.autoPlay) {
                btnAuto.classList.add('bg-indigo-600', 'text-white');
                document.getElementById('text-auto').innerText = 'Auto: ON';
                if (!gameState.isTyping) advanceNode();
            } else {
                btnAuto.classList.remove('bg-indigo-600', 'text-white');
                document.getElementById('text-auto').innerText = 'Auto: OFF';
            }
        }

        function calculateEndingId() {
            // ステータスパラメータによる1〜300の全分岐IDの計算ロジック
            let score = (stats.yui * 7 + stats.aoi * 13 + stats.ren * 17 + stats.sho * 19 + stats.chaos * 23) + Math.floor(Math.random() * 10);
            let id = (Math.abs(score) % 300) + 1;
            return id;
        }

        function triggerEnding(endingId) {
            playSound('ending');
            if (!gameState.unlockedEndings.includes(endingId)) {
                gameState.unlockedEndings.push(endingId);
                saveGlobalEndings();
            }

            document.getElementById('end-title').innerText = `ENDING #${endingId.toString().padStart(3, '0')}`;
            document.getElementById('end-desc').innerText = `【世界線 #${endingId} に到達しました】\nあなたの選択によって紡がれた独自の結末です。全300種類のエンディング完全コンプリートを目指してみてください！`;
            document.getElementById('ending-screen').classList.remove('hidden');
        }

        function openBacklog() {
            playSound('click');
            const list = document.getElementById('backlog-content');
            list.innerHTML = '';
            gameState.history.forEach(item => {
                const div = document.createElement('div');
                div.className = "p-3 rounded-lg bg-slate-900/60 border border-slate-800";
                div.innerHTML = `<span class="font-bold text-indigo-400 block text-xs mb-1">${item.speaker}</span><p class="text-slate-200 serif-text">${item.text}</p>`;
                list.appendChild(div);
            });
            document.getElementById('modal-backlog').classList.remove('hidden');
        }

        function openEndingsModal() {
            playSound('click');
            const grid = document.getElementById('endings-grid');
            grid.innerHTML = '';

            for (let i = 1; i <= 300; i++) {
                const isUnlocked = gameState.unlockedEndings.includes(i);
                const card = document.createElement('div');
                card.className = `p-3 rounded-lg border text-center text-xs ${isUnlocked ? 'bg-indigo-900/40 border-indigo-500 text-indigo-200 font-bold' : 'bg-slate-900/30 border-slate-800 text-slate-600'}`;
                card.innerText = isUnlocked ? `END #${i}` : `???`;
                grid.appendChild(card);
            }

            document.getElementById('modal-endings').classList.remove('hidden');
        }

        function openSaveLoad(mode) {
            playSound('click');
            const title = document.getElementById('saveload-title');
            const slotsContainer = document.getElementById('saveload-slots');
            title.innerHTML = mode === 'save' ? '<i class="fa-solid fa-floppy-disk"></i> セーブデータの保存' : '<i class="fa-solid fa-folder-open"></i> セーブデータの読込';
            slotsContainer.innerHTML = '';

            for (let i = 1; i <= 6; i++) {
                const saveDataKey = `boundary_choices_slot_${i}`;
                const savedDataRaw = localStorage.getItem(saveDataKey);
                let saveData = savedDataRaw ? JSON.parse(savedDataRaw) : null;

                const slot = document.createElement('div');
                slot.className = "p-4 rounded-xl bg-slate-900/80 border border-slate-800 flex justify-between items-center";
                
                if (saveData) {
                    slot.innerHTML = `
                        <div>
                            <span class="text-xs font-bold text-indigo-400 block mb-1">スロット ${i} - ${saveData.date}</span>
                            <p class="text-sm font-medium text-slate-200">${saveData.chapterName || '保存データ'}</p>
                        </div>
                        <button onclick="executeSaveLoad('${mode}', ${i})" class="px-4 py-2 rounded-lg text-sm font-bold ${mode==='save'?'bg-indigo-600':'bg-emerald-600'} text-white">
                            ${mode === 'save' ? '上書き' : 'ロード'}
                        </button>
                    `;
                } else {
                    slot.innerHTML = `
                        <div><span class="text-xs font-bold text-slate-500 block">スロット ${i}</span><p class="text-sm text-slate-600">---- 空きスロット ----</p></div>
                        <button onclick="executeSaveLoad('${mode}', ${i})" class="px-4 py-2 rounded-lg text-sm font-bold ${mode==='save'?'bg-indigo-600':'opacity-40 bg-slate-800'}" ${mode==='load'?'disabled':''}>
                            ${mode === 'save' ? '新規保存' : '空き'}
                        </button>
                    `;
                }
                slotsContainer.appendChild(slot);
            }
            document.getElementById('modal-saveload').classList.remove('hidden');
        }

        function executeSaveLoad(mode, slotIndex) {
            playSound('click');
            const key = `boundary_choices_slot_${slotIndex}`;
            if (mode === 'save') {
                const nodeObj = SCENARIO[gameState.currentNode];
                const savePayload = {
                    nodeId: gameState.currentNode,
                    chapterName: nodeObj ? nodeObj.chapterName : '不明',
                    date: new Date().toLocaleString('ja-JP'),
                    history: gameState.history,
                    stats: stats
                };
                localStorage.setItem(key, JSON.stringify(savePayload));
                openSaveLoad('save');
            } else if (mode === 'load') {
                const raw = localStorage.getItem(key);
                if (raw) {
                    const data = JSON.parse(raw);
                    gameState.currentNode = data.nodeId;
                    gameState.history = data.history || [];
                    stats = data.stats || { yui: 0, aoi: 0, ren: 0, sho: 0, chaos: 0 };
                    closeModal('modal-saveload');
                    document.getElementById('title-screen').classList.add('hidden');
                    renderNode(data.nodeId);
                }
            }
        }

        function closeModal(id) {
            playSound('click');
            document.getElementById(id).classList.add('hidden');
        }

        window.onload = function() {
            loadGlobalSave();
        };
    </script>
</body>
</html>
