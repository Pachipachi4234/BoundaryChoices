<!DOCTYPE html>
<html lang="ja">
<head>

    <!-- FontAwesome for icons -->

    <style>
        body {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background-color: #07090e;
            color: #e2e8f0;
        }
        .serif-text {
            font-family: 'Shippori Mincho', serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 3px;
        }
        .novel-box {
            background: linear-gradient(180deg, rgba(10, 15, 30, 0.88) 0%, rgba(20, 28, 48, 0.95) 100%);
            border: 1px solid rgba(129, 140, 248, 0.35);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(99, 102, 241, 0.15);
        }
        .glass-panel {
            background: rgba(10, 15, 30, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .choice-btn {
            background: linear-gradient(90deg, rgba(30, 41, 59, 0.92) 0%, rgba(49, 62, 89, 0.92) 100%);
            border: 1px solid rgba(129, 140, 248, 0.4);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .choice-btn:hover {
            background: linear-gradient(90deg, rgba(79, 70, 229, 0.85) 0%, rgba(124, 58, 237, 0.85) 100%);
            border-color: rgba(199, 210, 254, 0.9);
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.5);
        }
        .portrait-img {
            filter: drop-shadow(0 15px 20px rgba(0, 0, 0, 0.8));
            transition: all 0.35s ease-in-out;
        }
        .portrait-active {
            filter: drop-shadow(0 0 30px rgba(129, 140, 248, 0.6)) brightness(1.05);
            transform: scale(1.03);
        }
        .portrait-inactive {
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.9)) brightness(0.45) grayscale(30%);
            transform: scale(0.96);
        }
        .title-btn {
            background: linear-gradient(90deg, rgba(30, 41, 59, 0.85) 0%, rgba(49, 62, 89, 0.85) 100%);
            border: 1px solid rgba(165, 180, 252, 0.3);
            transition: all 0.3s ease;
        }
        .title-btn:hover {
            background: linear-gradient(90deg, rgba(79, 70, 229, 0.9) 0%, rgba(147, 51, 234, 0.9) 100%);
            border-color: rgba(224, 231, 255, 0.8);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.6);
            transform: translateX(6px);
        }

</head>
<body class="h-screen w-screen flex flex-col justify-center items-center relative bg-slate-950 text-slate-100 select-none">

    <!-- TITLE / START SCREEN OVERLAY -->

        <!-- Title Header -->

                境界の選択肢

            <p class="text-slate-400 text-xs md:text-base mt-3 serif-text tracking-widest">— Boundary Choices —</p>
        </div>

        <!-- Title Menu Buttons -->
        <div class="relative z-10 w-full max-w-md flex flex-col space-y-4 mb-12">
            <button onclick="startGameFromTitle()" class="title-btn p-4 rounded-xl font-bold text-lg text-white flex items-center justify-between px-6 shadow-xl">

                <i class="fa-solid fa-arrow-right text-xs opacity-60"></i>
            </button>
            <button onclick="openSaveLoadFromTitle()" class="title-btn p-4 rounded-xl font-bold text-lg text-white flex items-center justify-between px-6 shadow-xl">
                <span class="flex items-center space-x-3"><i class="fa-solid fa-folder-open text-indigo-400"></i><span>ロード（続きから）</span></span>
                <i class="fa-solid fa-arrow-right text-xs opacity-60"></i>
            </button>
            <button onclick="openEndingsModal()" class="title-btn p-4 rounded-xl font-bold text-lg text-white flex items-center justify-between px-6 shadow-xl">
                <span class="flex items-center space-x-3"><i class="fa-solid fa-trophy text-amber-400"></i><span>エンディング画廊</span></span>
                <span id="title-ending-count" class="text-xs bg-amber-950/80 text-amber-300 border border-amber-500/40 px-2.5 py-1 rounded-full">0/20</span>
            </button>
            <button onclick="openFlowchart()" class="title-btn p-4 rounded-xl font-bold text-lg text-white flex items-center justify-between px-6 shadow-xl">
                <span class="flex items-center space-x-3"><i class="fa-solid fa-diagram-project text-cyan-400"></i><span>フローチャート</span></span>
                <i class="fa-solid fa-arrow-right text-xs opacity-60"></i>
            </button>
        </div>

        <div class="relative z-10 text-xs text-slate-500 font-mono">© 2026 Boundary Choices Project. All rights reserved.</div>
    </div>

    <!-- GAME CONTAINER -->
    <div id="game-container" class="relative w-full h-full max-w-[1920px] max-h-[1080px] overflow-hidden flex flex-col justify-between shadow-2xl">
        
        <!-- BACKGROUND LAYER -->
        <div id="bg-layer" class="absolute inset-0 bg-cover bg-center transition-all duration-700 transform scale-105"
             style="background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1600&auto=format&fit=crop');">
            <div id="bg-overlay" class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-slate-950/20 transition-all duration-500"></div>
        </div>

        <!-- TOP BAR / NAVIGATION -->
        <header class="relative z-20 flex justify-between items-center p-4 md:p-6 bg-gradient-to-b from-slate-950/90 to-transparent">
            <div class="flex items-center space-x-3">

                    <i class="fa-solid fa-house text-xs"></i> <span class="hidden sm:inline">タイトル</span>
                </button>
                <span class="text-xs md:text-sm font-bold tracking-widest px-3 py-1 bg-indigo-900/60 border border-indigo-500/40 rounded-full text-indigo-300 uppercase">

            </div>

            <!-- System Controls -->
            <div class="flex items-center space-x-2 md:space-x-3">

                    <i class="fa-solid fa-play text-xs"></i> <span id="text-auto">Auto: OFF</span>
                </button>
                <button onclick="toggleSkip()" id="btn-skip" class="px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg bg-slate-800/80 border border-slate-700 hover:bg-amber-600 transition flex items-center space-x-1">
                    <i class="fa-solid fa-forward text-xs"></i> <span id="text-skip">Skip: OFF</span>
                </button>
                <button onclick="openBacklog()" class="px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg bg-slate-800/80 border border-slate-700 hover:bg-indigo-600 transition">
                    <i class="fa-solid fa-list-ul"></i> <span class="hidden sm:inline">履歴</span>
                </button>
                <button onclick="openFlowchart()" class="px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg bg-slate-800/80 border border-slate-700 hover:bg-indigo-600 transition">
                    <i class="fa-solid fa-diagram-project"></i> <span class="hidden sm:inline">分岐図</span>
                </button>
                <button onclick="openSaveLoad('save')" class="px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg bg-slate-800/80 border border-slate-700 hover:bg-indigo-600 transition">
                    <i class="fa-solid fa-floppy-disk"></i> <span class="hidden sm:inline">保存</span>
                </button>
                <button onclick="openSaveLoad('load')" class="px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg bg-slate-800/80 border border-slate-700 hover:bg-indigo-600 transition">
                    <i class="fa-solid fa-folder-open"></i> <span class="hidden sm:inline">読込</span>
                </button>
                <button onclick="openEndingsModal()" class="px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg bg-indigo-900/80 border border-indigo-500/50 hover:bg-indigo-700 transition text-indigo-200">
                    <i class="fa-solid fa-trophy"></i> <span id="ending-count-badge">0/20</span>
                </button>
                <button onclick="toggleAudio()" id="btn-audio" class="p-2 text-sm rounded-lg bg-slate-800/80 border border-slate-700 hover:bg-indigo-600 transition text-slate-300">
                    <i class="fa-solid fa-volume-xmark" id="icon-audio"></i>
                </button>
            </div>
        </header>

        <!-- CHARACTER PORTRAITS STAGE -->
        <div id="character-stage" class="relative flex-1 w-full flex justify-center items-end px-4 md:px-16 pointer-events-none z-10 pb-2">
            <!-- Left Slot (Sho / Ren / Aoi) -->
            <div id="portrait-left-box" class="hidden w-1/3 max-w-[380px] h-[80%] relative flex justify-center items-end transition-all duration-300 transform">
                <img id="portrait-left" src="" alt="Left Character" class="h-full object-contain object-bottom portrait-img">
            </div>
            <!-- Center Slot (Yui) -->
            <div id="portrait-center-box" class="hidden w-1/3 max-w-[420px] h-[88%] relative flex justify-center items-end transition-all duration-300 transform">
                <img id="portrait-center" src="" alt="Center Character" class="h-full object-contain object-bottom portrait-img">
            </div>
            <!-- Right Slot (Aoi / Ren / Sho) -->
            <div id="portrait-right-box" class="hidden w-1/3 max-w-[380px] h-[80%] relative flex justify-center items-end transition-all duration-300 transform">
                <img id="portrait-right" src="" alt="Right Character" class="h-full object-contain object-bottom portrait-img">
            </div>
        </div>

        <!-- CHOICES OVERLAY -->
        <div id="choices-container" class="hidden absolute inset-0 z-30 flex flex-col justify-center items-center bg-slate-950/75 backdrop-blur-md p-6 space-y-4 animate-fade-in">
            <h3 class="text-xl md:text-2xl font-bold text-indigo-300 mb-2 tracking-wide serif-text">運命の分岐点</h3>
            <div id="choices-list" class="w-full max-w-2xl flex flex-col space-y-3"></div>
        </div>

        <!-- NOVEL DIALOGUE BOX -->
        <div class="relative z-20 w-full p-4 md:p-8 flex justify-center cursor-pointer" onclick="handleStageClick()">
            <div class="w-full max-w-5xl novel-box rounded-2xl p-5 md:p-8 relative transition-all duration-300">
                <!-- Character Name Tag -->
                <div id="speaker-tag" class="absolute -top-4 left-6 md:left-10 px-5 py-1.5 rounded-lg bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold text-sm md:text-base shadow-lg border border-indigo-400/30 flex items-center space-x-2">

                <div id="next-indicator" class="absolute bottom-4 right-6 text-indigo-400 animate-bounce">
                    <i class="fa-solid fa-caret-down text-xl"></i>
                </div>
            </div>
        </div>

    <!-- MODAL: BACKLOG -->

                <div id="flowchart-tree" class="space-y-4"></div>

        </div>
    </div>

    <!-- MODAL: ENDINGS LIST -->
    <div id="modal-endings" class="hidden fixed inset-0 z-50 flex justify-center items-center bg-slate-950/85 backdrop-blur-md p-4">
        <div class="w-full max-w-4xl max-h-[85vh] glass-panel rounded-2xl p-6 flex flex-col shadow-2xl border border-indigo-500/30">
            <div class="flex justify-between items-center pb-4 border-b border-slate-700">
                <h2 class="text-xl font-bold text-indigo-300 flex items-center space-x-2">
                    <i class="fa-solid fa-trophy text-amber-400"></i> <span>エンディングギャラリー (全20種)</span>

                <div class="flex items-center space-x-4">
                    <span id="modal-ending-progress" class="text-sm font-bold text-amber-400 bg-amber-950/50 border border-amber-500/40 px-3 py-1 rounded-full">達成率: 0 / 20</span>
                    <button onclick="closeModal('modal-endings')" class="text-slate-400 hover:text-white text-2xl">&times;</button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto my-4 pr-2">
                <div id="endings-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </div>
    </div>

    <!-- MODAL: SAVE / LOAD -->
    <div id="modal-saveload" class="hidden fixed inset-0 z-50 flex justify-center items-center bg-slate-950/85 backdrop-blur-md p-4">
        <div class="w-full max-w-3xl max-h-[85vh] glass-panel rounded-2xl p-6 flex flex-col shadow-2xl border border-indigo-500/30">
            <div class="flex justify-between items-center pb-4 border-b border-slate-700">
                <h2 id="saveload-title" class="text-xl font-bold text-indigo-300 flex items-center space-x-2">
                    <i class="fa-solid fa-floppy-disk"></i> <span>セーブデータ一覧</span>

                <button onclick="closeModal('modal-saveload')" class="text-slate-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div id="saveload-slots" class="flex-1 overflow-y-auto my-4 space-y-3 pr-2"></div>
        </div>
    </div>

    <div id="ending-screen" class="hidden fixed inset-0 z-50 flex flex-col justify-center items-center bg-black/95 p-6 text-center animate-fade-in">

        <div class="flex space-x-4">
            <button onclick="returnToTitle()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg transition">タイトル画面へ</button>
            <button onclick="openEndingsModal()" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-indigo-300 font-bold rounded-xl border border-indigo-500/30 transition">エンディング一覧</button>
        </div>
    </div>

        let gameState = {

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!gameState.audioEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(784, audioCtx.currentTime); // G5
                    osc.frequency.exponentialRampToValueAtTime(392, audioCtx.currentTime + 0.06);
                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.06);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.06);
                } else if (type === 'choice') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                } else if (type === 'ending') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.5);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.5);
                }
            } catch (e) {
                console.error(e);
            }
        }

        function toggleAudio() {
            initAudio();
            gameState.audioEnabled = !gameState.audioEnabled;
            const icon = document.getElementById('icon-audio');
            const btn = document.getElementById('btn-audio');
            if (gameState.audioEnabled) {
                icon.className = 'fa-solid fa-volume-high';
                btn.classList.add('bg-indigo-600', 'text-white');
                playSound('click');
            } else {
                icon.className = 'fa-solid fa-volume-xmark';
                btn.classList.remove('bg-indigo-600', 'text-white');
            }
        }

        function loadGlobalSave() {
            const saved = localStorage.getItem('boundary_choices_endings');
            if (saved) {
                try { gameState.unlockedEndings = JSON.parse(saved); } catch (e) { gameState.unlockedEndings = []; }
            }
            updateEndingBadge();
        }

        function saveGlobalEndings() {
            localStorage.setItem('boundary_choices_endings', JSON.stringify(gameState.unlockedEndings));
            updateEndingBadge();
        }

        function updateEndingBadge() {
            const count = gameState.unlockedEndings.length;
            document.getElementById('ending-count-badge').innerText = `${count}/20`;
            const titleCount = document.getElementById('title-ending-count');
            if (titleCount) titleCount.innerText = `${count}/20`;
            const progress = document.getElementById('modal-ending-progress');
            if (progress) progress.innerText = `達成率: ${count} / 20`;
        }

        /* Title Screen Navigation */
        function startGameFromTitle() {
            playSound('click');
            document.getElementById('title-screen').classList.add('hidden');
            gameState.currentNode = "start";
            gameState.history = [];
            gameState.visitedNodes = ["start"];
            renderNode("start");
        }

        function openSaveLoadFromTitle() {
            playSound('click');
            openSaveLoad('load');
        }

        function returnToTitle() {
            playSound('click');
            document.getElementById('ending-screen').classList.add('hidden');
            document.getElementById('title-screen').classList.remove('hidden');
        }

        /* Scenario Renderer */
        function renderNode(nodeId) {
            const node = SCENARIO[nodeId];
            if (!node) return;

            gameState.currentNode = nodeId;
            if (!gameState.visitedNodes.includes(nodeId)) {
                gameState.visitedNodes.push(nodeId);
            }

            if (node.endingId) {
                triggerEnding(node.endingId);
                return;
            }

            document.getElementById('chapter-num').innerText = node.chapter || '1';
            document.getElementById('chapter-title').innerText = node.chapterName || '物語';

            if (node.bg) {
                document.getElementById('bg-layer').style.backgroundImage = `url('${node.bg}')`;
            }

            updatePortraits(node);

            document.getElementById('choices-container').classList.add('hidden');

            const speakerInfo = CHARACTERS[node.speaker] || { name: node.speaker, color: "from-slate-700 to-slate-800" };
            const speakerTag = document.getElementById('speaker-tag');
            document.getElementById('speaker-name').innerText = speakerInfo.name;
            speakerTag.className = `absolute -top-4 left-6 md:left-10 px-5 py-1.5 rounded-lg bg-gradient-to-r ${speakerInfo.color} text-white font-bold text-sm md:text-base shadow-lg border border-white/20 flex items-center space-x-2`;

            if (node.text && node.speaker) {
                gameState.history.push({ speaker: speakerInfo.name, text: node.text });
            }

            startTypewriter(node.text || "", () => {
                if (node.choices) {
                    showChoices(node.choices);
                } else if (gameState.autoPlay) {
                    setTimeout(() => { if (gameState.autoPlay) advanceNode(); }, 1800);
                } else if (gameState.skipMode) {
                    setTimeout(() => { if (gameState.skipMode) advanceNode(); }, 200);
                }
            });
        }

        function updatePortraits(node) {
            const positions = ['left', 'center', 'right'];
            positions.forEach(pos => {
                const box = document.getElementById(`portrait-${pos}-box`);
                const img = document.getElementById(`portrait-${pos}`);
                const charKey = node[pos];

                if (charKey && CHARACTERS[charKey] && CHARACTERS[charKey].image) {
                    img.src = CHARACTERS[charKey].image;
                    box.classList.remove('hidden');

                    if (node.speaker === charKey) {
                        img.className = "h-full object-contain object-bottom portrait-img portrait-active";
                    } else {
                        img.className = "h-full object-contain object-bottom portrait-img portrait-inactive";
                    }
                } else {
                    box.classList.add('hidden');
                }
            });
        }

        function startTypewriter(text, onComplete) {
            clearInterval(gameState.typewriterTimer);
            const textEl = document.getElementById('dialogue-text');
            textEl.innerHTML = '';
            gameState.typewriterIndex = 0;
            gameState.isTyping = true;
            document.getElementById('next-indicator').classList.add('hidden');

            if (gameState.skipMode) {
                textEl.innerText = text;
                gameState.isTyping = false;
                document.getElementById('next-indicator').classList.remove('hidden');
                if (onComplete) onComplete();
                return;
            }

            gameState.typewriterTimer = setInterval(() => {
                if (gameState.typewriterIndex < text.length) {
                    textEl.innerText += text.charAt(gameState.typewriterIndex);
                    gameState.typewriterIndex++;
                } else {
                    clearInterval(gameState.typewriterTimer);
                    gameState.isTyping = false;
                    document.getElementById('next-indicator').classList.remove('hidden');
                    if (onComplete) onComplete();
                }
            }, 30);
        }

        function handleStageClick() {
            playSound('click');
            const node = SCENARIO[gameState.currentNode];
            if (!node) return;

            if (gameState.isTyping) {
                clearInterval(gameState.typewriterTimer);
                document.getElementById('dialogue-text').innerText = node.text || '';
                gameState.isTyping = false;
                document.getElementById('next-indicator').classList.remove('hidden');

                if (node.choices) {
                    showChoices(node.choices);
                }
            } else {
                if (!node.choices) {
                    advanceNode();
                }
            }
        }

        function advanceNode() {
            const node = SCENARIO[gameState.currentNode];
            if (node && node.next) {
                renderNode(node.next);
            }
        }

        function showChoices(choices) {
            const container = document.getElementById('choices-container');
            const list = document.getElementById('choices-list');
            list.innerHTML = '';

            choices.forEach((c) => {
                const btn = document.createElement('button');
                btn.className = "choice-btn w-full p-4 rounded-xl text-left font-bold text-slate-100 text-base md:text-lg flex justify-between items-center group cursor-pointer";
                btn.innerHTML = `
                    <span class="group-hover:translate-x-1 transition-transform">${c.text}</span>
                    <i class="fa-solid fa-chevron-right text-indigo-400 group-hover:text-white transition"></i>
                `;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    playSound('choice');
                    container.classList.add('hidden');
                    renderNode(c.next);
                };
                list.appendChild(btn);
            });

            container.classList.remove('hidden');
        }

        function toggleAutoPlay() {
            playSound('click');
            gameState.autoPlay = !gameState.autoPlay;
            if (gameState.autoPlay) gameState.skipMode = false;
            updateControlUI();
            if (gameState.autoPlay && !gameState.isTyping) advanceNode();
        }

        function toggleSkip() {
            playSound('click');
            gameState.skipMode = !gameState.skipMode;
            if (gameState.skipMode) gameState.autoPlay = false;
            updateControlUI();
            if (gameState.skipMode && gameState.isTyping) {
                const node = SCENARIO[gameState.currentNode];
                startTypewriter(node.text || "");
            }
        }

        function updateControlUI() {
            const btnAuto = document.getElementById('btn-auto');
            const btnSkip = document.getElementById('btn-skip');
            if (gameState.autoPlay) {
                btnAuto.classList.add('bg-indigo-600', 'text-white');
                document.getElementById('text-auto').innerText = 'Auto: ON';
            } else {
                btnAuto.classList.remove('bg-indigo-600', 'text-white');
                document.getElementById('text-auto').innerText = 'Auto: OFF';
            }

            if (gameState.skipMode) {
                btnSkip.classList.add('bg-amber-600', 'text-white');
                document.getElementById('text-skip').innerText = 'Skip: ON';
            } else {
                btnSkip.classList.remove('bg-amber-600', 'text-white');
                document.getElementById('text-skip').innerText = 'Skip: OFF';
            }
        }

        function triggerEnding(endingId) {
            playSound('ending');
            const endData = ENDINGS.find(e => e.id === endingId) || { title: "UNKNOWN END", desc: "" };

            if (!gameState.unlockedEndings.includes(endingId)) {
                gameState.unlockedEndings.push(endingId);
                saveGlobalEndings();
            }

            document.getElementById('end-title').innerText = `ENDING ${endingId.toString().padStart(2, '0')}: ${endData.title}`;
            document.getElementById('end-desc').innerText = endData.desc;
            document.getElementById('ending-screen').classList.remove('hidden');
        }

        function openBacklog() {
            playSound('click');
            const list = document.getElementById('backlog-content');
            list.innerHTML = '';

            gameState.history.forEach(item => {
                const div = document.createElement('div');
                div.className = "p-3 rounded-lg bg-slate-900/60 border border-slate-800";
                div.innerHTML = `<span class="font-bold text-indigo-400 block text-xs mb-1">${item.speaker}</span><p class="text-slate-200 serif-text">${item.text}</p>`;
                list.appendChild(div);
            });

            document.getElementById('modal-backlog').classList.remove('hidden');
        }

        function openFlowchart() {
            playSound('click');
            const tree = document.getElementById('flowchart-tree');
            tree.innerHTML = '';

            gameState.visitedNodes.forEach(nodeId => {
                const n = SCENARIO[nodeId];
                if (n && n.text) {
                    const nodeDiv = document.createElement('div');
                    const isCurrent = nodeId === gameState.currentNode;
                    nodeDiv.className = `p-3 rounded-xl border ${isCurrent ? 'bg-indigo-900/50 border-indigo-400 text-white' : 'bg-slate-900/50 border-slate-800 text-slate-400'} flex justify-between items-center`;
                    nodeDiv.innerHTML = `
                        <div>
                            <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-indigo-300 mr-2">${n.chapterName || '分岐'}</span>
                            <span class="text-sm font-medium">${n.speaker ? CHARACTERS[n.speaker]?.name + ': ' : ''}${n.text.substring(0, 25)}...</span>
                        </div>
                        ${isCurrent ? '<span class="text-xs font-bold text-amber-400 bg-amber-950/60 px-2 py-0.5 rounded-full border border-amber-500/40">現在地</span>' : ''}
                    `;
                    tree.appendChild(nodeDiv);
                }
            });

            document.getElementById('modal-flowchart').classList.remove('hidden');
        }

        function openEndingsModal() {
            playSound('click');
            const grid = document.getElementById('endings-grid');
            grid.innerHTML = '';

            ENDINGS.forEach(end => {
                const isUnlocked = gameState.unlockedEndings.includes(end.id);
                const card = document.createElement('div');
                card.className = `p-4 rounded-xl border ${isUnlocked ? 'bg-slate-900/90 border-indigo-500/50 text-slate-100' : 'bg-slate-950/50 border-slate-800/60 text-slate-600'} flex flex-col justify-between`;
                
                let badgeColor = 'bg-slate-800 text-slate-500';
                if (isUnlocked) {
                    if (end.type === 'TRUE') badgeColor = 'bg-amber-500/20 text-amber-300 border border-amber-500/40';
                    else if (end.type === 'GOOD') badgeColor = 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40';
                    else if (end.type === 'BAD') badgeColor = 'bg-rose-500/20 text-rose-300 border border-rose-500/40';
                    else badgeColor = 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/40';
                }

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${badgeColor}">
                                ENDING ${end.id.toString().padStart(2, '0')} [${end.type}]
                            </span>
                            <i class="fa-solid ${isUnlocked ? 'fa-lock-open text-amber-400' : 'fa-lock text-slate-700'}"></i>
                        </div>
                        <h4 class="font-bold text-base mb-1 serif-text ${isUnlocked ? 'text-slate-100' : 'text-slate-600'}">
                            ${isUnlocked ? end.title : '？？？？？？？？'}
                        </h4>
                        <p class="text-xs leading-relaxed ${isUnlocked ? 'text-slate-400' : 'text-slate-700'} serif-text">
                            ${isUnlocked ? end.desc : '条件を満たすと開放されます。'}
                        </p>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('modal-endings').classList.remove('hidden');
        }

        function openSaveLoad(mode) {
            playSound('click');
            const title = document.getElementById('saveload-title');
            const slotsContainer = document.getElementById('saveload-slots');
            title.innerHTML = mode === 'save' ? '<i class="fa-solid fa-floppy-disk"></i> セーブデータの保存' : '<i class="fa-solid fa-folder-open"></i> セーブデータの読込';
            slotsContainer.innerHTML = '';

            for (let i = 1; i <= 6; i++) {
                const saveDataKey = `boundary_choices_slot_${i}`;
                const savedDataRaw = localStorage.getItem(saveDataKey);
                let saveData = null;
                if (savedDataRaw) {
                    try { saveData = JSON.parse(savedDataRaw); } catch(e){}
                }

                const slot = document.createElement('div');
                slot.className = "p-4 rounded-xl bg-slate-900/80 border border-slate-800 hover:border-indigo-500/50 flex justify-between items-center transition";
                
                if (saveData) {
                    slot.innerHTML = `
                        <div>
                            <span class="text-xs font-bold text-indigo-400 block mb-1">スロット ${i} - ${saveData.date}</span>
                            <p class="text-sm font-medium text-slate-200">${saveData.chapterName || '保存データ'}</p>
                            <p class="text-xs text-slate-400 truncate max-w-md mt-1 serif-text">${saveData.previewText}</p>
                        </div>
                        <button onclick="executeSaveLoad('${mode}', ${i})" class="px-4 py-2 rounded-lg text-sm font-bold ${mode==='save'?'bg-indigo-600 hover:bg-indigo-500':'bg-emerald-600 hover:bg-emerald-500'} text-white transition">
                            ${mode === 'save' ? '上書き保存' : 'ロード'}
                        </button>
                    `;
                } else {
                    slot.innerHTML = `
                        <div>
                            <span class="text-xs font-bold text-slate-500 block mb-1">スロット ${i}</span>
                            <p class="text-sm font-medium text-slate-600">---- NO DATA ----</p>
                        </div>
                        <button onclick="executeSaveLoad('${mode}', ${i})" class="px-4 py-2 rounded-lg text-sm font-bold ${mode==='save'?'bg-indigo-600 hover:bg-indigo-500':'opacity-50 bg-slate-800 cursor-not-allowed'} text-white transition" ${mode==='load'?'disabled':''}>
                            ${mode === 'save' ? '新規保存' : '空き'}
                        </button>
                    `;
                }
                slotsContainer.appendChild(slot);
            }

            document.getElementById('modal-saveload').classList.remove('hidden');
        }

        function executeSaveLoad(mode, slotIndex) {
            playSound('click');
            const key = `boundary_choices_slot_${slotIndex}`;
            if (mode === 'save') {
                const currentNodeObj = SCENARIO[gameState.currentNode];
                const savePayload = {
                    nodeId: gameState.currentNode,
                    chapterName: currentNodeObj ? currentNodeObj.chapterName : '不明',
                    previewText: currentNodeObj ? currentNodeObj.text : '',
                    date: new Date().toLocaleString('ja-JP'),
                    history: gameState.history,
                    visitedNodes: gameState.visitedNodes
                };
                localStorage.setItem(key, JSON.stringify(savePayload));
                openSaveLoad('save');
            } else if (mode === 'load') {
                const raw = localStorage.getItem(key);
                if (raw) {
                    const data = JSON.parse(raw);
                    gameState.currentNode = data.nodeId;
                    gameState.history = data.history || [];
                    gameState.visitedNodes = data.visitedNodes || [data.nodeId];
                    closeModal('modal-saveload');
                    document.getElementById('title-screen').classList.add('hidden');
                    renderNode(data.nodeId);
                }
            }
        }

        function closeModal(id) {
            playSound('click');
            document.getElementById(id).classList.add('hidden');
        }

        document.addEventListener('keydown', (e) => {
            if (document.getElementById('title-screen').classList.contains('hidden')) {
                if (e.key === ' ' || e.key === 'Enter') {
                    handleStageClick();
                }
            }
        });

        window.onload = function() {
            loadGlobalSave();
        };
    </script>
</body>
</html>
